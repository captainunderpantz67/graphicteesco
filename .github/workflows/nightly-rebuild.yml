# Rebuild the live site every night so new/edited Shopify products show up by morning.
# Free GitHub Actions cron → pings the Cloudflare Pages deploy hook (stored as a repo secret).
name: Nightly site rebuild
on:
  schedule:
    - cron: "0 9 * * *"   # 9:00 UTC = 4:00 AM Central
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      CF_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - name: Cloudflare Pages
        if: ${{ env.CF_HOOK != '' }}
        run: curl -fsS -X POST "$CF_HOOK"
