# After the site redeploys, tell IndexNow search engines (Bing etc.) that pages changed.
name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "astro.config.mjs", "package.json"]
  workflow_run:
    workflows: ["Nightly site rebuild"]
    types: [completed]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sleep 240   # give Cloudflare Pages time to finish the deploy
      - run: node scripts/indexnow.mjs
